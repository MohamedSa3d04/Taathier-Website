<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E6D8"/>
      <stop offset="100%" stop-color="#E4D5C0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A24C"/>
      <stop offset="100%" stop-color="#B98B3B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="480" rx="28" fill="url(#bgGrad)"/>

  <!-- Concentric rings motif -->
  <circle cx="240" cy="240" r="170" fill="none" stroke="#0B3D36" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="240" cy="240" r="130" fill="none" stroke="#0B3D36" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Growth bars -->
  <g>
    <rect x="150" y="290" width="34" height="80" rx="6" fill="#0B3D36" fill-opacity="0.15"/>
    <rect x="198" y="250" width="34" height="120" rx="6" fill="#0B3D36" fill-opacity="0.25"/>
    <rect x="246" y="200" width="34" height="170" rx="6" fill="url(#barGrad)"/>
    <rect x="294" y="160" width="34" height="210" rx="6" fill="#0B3D36" fill-opacity="0.35"/>
  </g>

  <!-- Upward trend line -->
  <path d="M150 300 L198 265 L246 215 L294 170 L328 145" stroke="#0B3D36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="328" cy="145" r="7" fill="#0B3D36"/>
  <circle cx="328" cy="145" r="7" fill="none" stroke="#F0E6D8" stroke-width="2"/>

  <!-- Brand mark, scaled down, top right -->
  <g transform="translate(330, 70) scale(0.55)">
    <path d="M0 18 L18 0 L36 18 L18 36 Z" fill="#0B3D36" fill-opacity="0.85"/>
    <path d="M0 50 L18 32 L36 50 L18 68 Z" fill="#0B3D36" fill-opacity="0.85"/>
    <path d="M0 92 C0 100 6 106 16 106 L140 106 C150 106 154 114 154 122 L154 92 C154 100 150 92 140 92 Z" fill="#0B3D36" fill-opacity="0.85"/>
  </g>
</svg>
